[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "controlRB"
version = "0.2.1"
description = "Controlable thermal Convection model"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Gerben Beintema", email = "g.i.beintema@tue.nl" },
]
dependencies = [
    "Pillow",
    "matplotlib",
    "tqdm",
    "numpy",
    "scipy",
    "setGPU",
    "scikit-image",
    "pyglet",
    "ipython",
    "ipywidgets",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["controlRB*"]
